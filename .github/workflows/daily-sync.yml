name: Daily NBA Sync

on:
  schedule:
    # 05:00 UTC = 06:00 Paris (CET hiver) / 07:00 Paris (CEST été)
    # Les matchs se terminent au plus tard vers 05:30 Paris — cette heure est idéale.
    - cron: "0 5 * * *"
  workflow_dispatch: # déclenchement manuel pour tests

jobs:
  sync:
    name: Sync NBA data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version pnpm lue depuis le champ "packageManager" de package.json
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Sync playoffs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        # Retry : le compute Neon (free tier) peut être en veille (scale-to-zero).
        # Le premier essai réveille la base ; les suivants passent une fois réveillée.
        run: .github/scripts/retry.sh pnpm tsx scripts/sync-playoffs.ts

      - name: Run daily sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: .github/scripts/retry.sh pnpm tsx scripts/sync-daily.ts

      # --strict fait échouer le job en cas d'anomalie : c'est le signal
      # d'alerte. GitHub notifie le propriétaire du dépôt quand un workflow
      # planifié échoue, sans service tiers à brancher.
      - name: Check data health
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -o pipefail
          .github/scripts/retry.sh pnpm tsx scripts/check-data-health.ts --strict 2>&1 \
            | tee health-report.txt

      # Le rapport est lisible depuis la page du run, sans dérouler les logs.
      - name: Publier le rapport de santé
        if: always()
        run: |
          {
            echo "## Santé des données"
            echo ''
            echo '```'
            cat health-report.txt 2>/dev/null || echo 'rapport indisponible'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
